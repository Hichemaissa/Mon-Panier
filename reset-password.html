<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Réinitialiser le mot de passe · Mon Panier</title>
<style>body{margin:0;background:#fff8f1;color:#282331;font:16px/1.6 system-ui,Arial}main{max-width:440px;margin:9vh auto;padding:26px;background:#fff;border:1px solid #eee0d3;border-radius:18px;box-shadow:0 15px 45px #33221110}h1{font-size:24px}label{display:block;margin:14px 0 5px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;font:inherit}input{border:1px solid #cfc8c4}button{margin-top:17px;background:#f58227;color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.55}a{color:#b75b19}#message{min-height:2em}small{color:#6b6470}</style></head>
<body><main><h1>Réinitialiser votre mot de passe</h1><p id="message" role="status">Vérification du lien sécurisé…</p>
<form id="form" hidden><label for="password">Nouveau mot de passe</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirmer le mot de passe</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="submit" type="submit">Enregistrer le nouveau mot de passe</button></form>
<p><small>Utilisez le lien reçu par e-mail. Ne partagez jamais ce lien.</small></p><a href="admin.html">Retour à l'administration</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><script>
"use strict";
const cfg=window.MONPANIER_SUPABASE||{},message=document.getElementById("message"),form=document.getElementById("form");
const say=(s)=>message.textContent=s;
(async()=>{
 if(!cfg.url||!cfg.anonKey||!window.supabase){say("Configuration Supabase indisponible.");return}
 const client=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{detectSessionInUrl:true,flowType:"pkce"}});
 try{
   const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
   if(query.get("error")||hash.get("error"))throw new Error(query.get("error_description")||hash.get("error_description")||"Lien invalide.");
   if(query.get("token_hash")&&query.get("type")==="recovery"){
     const {error}=await client.auth.verifyOtp({token_hash:query.get("token_hash"),type:"recovery"});if(error)throw error;
   }else if(query.get("code")){
     const {error}=await client.auth.exchangeCodeForSession(query.get("code"));if(error)throw error;
   }else if(hash.get("access_token")&&hash.get("refresh_token")){
     const {error}=await client.auth.setSession({access_token:hash.get("access_token"),refresh_token:hash.get("refresh_token")});if(error)throw error;
   }
   const {data:{session},error}=await client.auth.getSession();
   if(error)throw error;
   if(!session){say("Lien de récupération absent ou expiré. Demandez un nouveau lien depuis Supabase.");return}
   history.replaceState(null,"",location.pathname);
   form.hidden=false;say("Choisissez un nouveau mot de passe (8 caractères minimum).");
   form.addEventListener("submit",async e=>{
     e.preventDefault();
     const password=document.getElementById("password").value;
     if(password!==document.getElementById("confirm").value){say("Les mots de passe ne correspondent pas.");return}
     const button=document.getElementById("submit");button.disabled=true;
     const {error}=await client.auth.updateUser({password});button.disabled=false;
     if(error){say("Erreur : "+error.message);return}
     form.hidden=true;await client.auth.signOut();say("Mot de passe modifié. Vous pouvez vous connecter à l'administration.");
   });
 }catch(e){say("Impossible de valider le lien : "+e.message)}
})();
</script></body></html>

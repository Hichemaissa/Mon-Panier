<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f58227">
<title>Réinitialiser le mot de passe · Mon Panier Informatique</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#fff8f1;color:#282331;font:16px/1.6 system-ui,Arial}
main{width:min(100%,460px);padding:28px;background:#fff;border:1px solid #eee0d3;border-radius:18px;box-shadow:0 15px 45px #33221110}
h1{font-size:24px;line-height:1.3;margin:0 0 12px}
p{color:#635b64}
label{display:block;margin:14px 0 5px;font-weight:650}
input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;font:inherit}
input{border:1px solid #cfc8c4}
input:focus-visible,button:focus-visible{outline:3px solid #fd994b;outline-offset:2px}
button{margin-top:17px;background:#f58227;color:#fff;border:0;font-weight:700;cursor:pointer}
button:disabled{opacity:.55}
a{color:#b75b19}
#message{min-height:2em}
small{color:#6b6470}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<a href="index.html">🛒 Mon Panier Informatique</a>
<h1>Réinitialiser votre mot de passe</h1>
<p id="message" role="status" aria-live="polite">Vérification du lien sécurisé…</p>
<p id="identity" hidden></p>
<form id="form" hidden>
<label for="password">Nouveau mot de passe</label>
<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<label for="confirm">Confirmer le mot de passe</label>
<input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<button id="submit" type="submit">Enregistrer le nouveau mot de passe</button>
</form>
<p><small>Ne partagez jamais votre lien de récupération ni votre mot de passe.</small></p>
<a href="admin.html">Retour à l'administration</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<script>
(function(){
"use strict";
const cfg=window.MONPANIER_SUPABASE||{};
const message=document.getElementById("message");
const identity=document.getElementById("identity");
const form=document.getElementById("form");
const submit=document.getElementById("submit");
const query=new URLSearchParams(location.search);
const hash=new URLSearchParams(location.hash.slice(1));
let recoveryReady=false;
function say(s){message.textContent=s}
if(!cfg.url||!cfg.anonKey||!window.supabase){
  say("Connexion à Supabase indisponible. Réessayez plus tard.");
  return;
}
const client=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{detectSessionInUrl:true}});
function allowReset(session){
  if(!session||!session.user||recoveryReady)return;
  recoveryReady=true;
  identity.hidden=false;
  identity.textContent="Compte : "+(session.user.email||"utilisateur connecté");
  form.hidden=false;
  say("Choisissez un nouveau mot de passe (12 caractères minimum).");
  // Le client a déjà reçu les jetons : retirer les paramètres sensibles de l'URL.
  if(location.search||location.hash)history.replaceState(null,"",location.pathname);
}
client.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY"&&session)allowReset(session);
});
(async()=>{
  try{
    if(query.has("error")||hash.has("error")){
      throw new Error(query.get("error_description")||hash.get("error_description")||"Lien invalide ou expiré.");
    }
    // Certaines configurations d'e-mail envoient un token_hash plutôt qu'un fragment.
    if(query.get("token_hash")&&query.get("type")==="recovery"){
      const {error}=await client.auth.verifyOtp({token_hash:query.get("token_hash"),type:"recovery"});
      if(error)throw error;
    }
    // Supabase JS traite automatiquement les liens implicites et les codes PKCE.
    const {data,error}=await client.auth.getSession();
    if(error)throw error;
    if(data.session){
      // Une session déjà ouverte permet aussi de changer son propre mot de passe.
      // Le compte concerné est affiché explicitement avant toute modification.
      allowReset(data.session);
    }else if(!recoveryReady){
      say("Lien de récupération absent ou expiré. Demandez un nouveau lien depuis la page d'administration.");
    }
  }catch(e){
    if(!recoveryReady)say("Impossible de valider le lien : "+(e.message||"erreur inconnue"));
  }
})();
form.addEventListener("submit",async e=>{
  e.preventDefault();
  if(!recoveryReady)return;
  const password=document.getElementById("password").value;
  const confirmation=document.getElementById("confirm").value;
  if(password.length<12){say("Utilisez au moins 12 caractères.");return}
  if(password!==confirmation){say("Les mots de passe ne correspondent pas.");return}
  submit.disabled=true;
  say("Enregistrement du nouveau mot de passe…");
  try{
    const {error}=await client.auth.updateUser({password});
    if(error)throw error;
    form.reset();
    form.hidden=true;
    identity.hidden=true;
    recoveryReady=false;
    say("Mot de passe modifié avec succès. Retournez à l'administration et connectez-vous.");
    try{await client.auth.signOut({scope:"local"})}catch(_){}
  }catch(e){
    say("Erreur : "+(e.message||"réessayez avec un nouveau lien"));
  }finally{
    submit.disabled=false;
  }
});
})();
</script>
</body>
</html>

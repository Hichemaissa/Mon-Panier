<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff7010">
  <meta name="description" content="Mon Panier Informatique — Votre matériel au meilleur prix !">
  <title>Mon Panier Informatique</title>
  <script>
    // Keep account recovery links working if Supabase redirects to the home page.
    (function () {
      const hash = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);
      if (hash.get("type") !== "recovery" && query.get("type") !== "recovery") return;
      const page = new URL("./reset-password.html", location.href);
      page.search = location.search; page.hash = location.hash;
      location.replace(page.href);
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
    body { background: #fff; }
    main { width: 100%; margin: 0 auto; }
    /* Show the supplied promotional picture, whole and untouched:
       no overlay, text, border, cropping, filter or stretching. */
    #main-brand-banner {
      display: block;
      width: 100%;
      max-width: 1536px;
      height: auto;
      object-fit: contain;
      margin: 0 auto;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <img id="main-brand-banner" width="1536" height="1024"
      alt="Mon Panier Informatique — Votre matériel au meilleur prix. Ordinateurs portables, PC de bureau, accessoires, composants, jeux et logiciels."
      decoding="async" fetchpriority="high">
  </main>
  <script src="./branding.js"></script>
  <script src="./hero-banner.js"></script>
</body>
</html>
